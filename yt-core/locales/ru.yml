_version: 1
# [i18n] yt-core's messages in Russian: one file per language (en, ru, and - not reviewed -
# fr, de, zh, ja), every key in each. An error's message starts with its code, the same in
# every language (src/i18n.rs tests it) - after a SQLSTATE such as 0A000: when it has one,
# which the extension reads at position 0. YT lite's codes have three digits, YT-Ennn:
# yt-core-proto YT-E001 to YT-E029, yt-core YT-E030 and up. YT Cluster's own have four,
# YT-Ennnn. ytserv reads these files too, by symlink (its locales/lite.<lang>.yml): what a
# shared link file says is the same there, under the same code.

# === the shared link files (src/core/signin.rs, route.rs): the lite node and ytserv ===
link-no-target-above: "YT-E030 нет узла вышестоящего кластера, через который можно войти"
link-no-target-az: "YT-E031 нет узла az %{az}, через который можно войти"
# the dial rules' reasons: the tail of the message that refuses a dial - no code of their own
link-rule-lower: "к кластеру LOWER никогда не подключаются: он сам входит к нам, и мы храним для него ключ проверки, а не адрес"
link-rule-upper-member: "правило 1: вверх подключается только лидер этого кластера; рядовому узлу не к кому подключаться через границу"
link-rule-upper-leader: "правило 1: связь вверх должна обходить лидера вышестоящего кластера - выберите обычный узел"
link-rule-neighbor: "правило 2: связь с соседом - только между лидерами"

# === the lite node (src/core/store.rs, calls.rs) ===
lite-leaf-no-down: "YT-E032 легкий узел - лист: вниз от него ничего не идет"
# a call's failure, the tail of the message that names the turn - no code of their own
lite-call-tls: "%{host} (TLS): %{error}"
lite-call-then-plaintext: "%{first} - затем без TLS: %{error}"

# === yt-lite: its command line and its start (src/main.rs) ===
lite-usage-about: "yt-lite - YT lite: узел YT для одной базы данных этого экземпляра PostgreSQL, лист кластера YT.\nОн обслуживает unix-сокет расширения yt_cluster, хранит то, что фиксирует база данных, пока это\nне получит вышестоящий кластер, и применяет то, что приходит сверху.\n"
lite-usage-args: "  yt-lite [--db] <url> [--config <schema.table>] [--file <file>] [--uuid <uuid>] [-v | -q]\n\n  <url>               база данных, которую он обслуживает, через unix-сокет экземпляра:\n                      postgresql://postgres@localhost/appdb?host=/var/run/postgresql\n  --config            его таблица конфигурации (по умолчанию yt_config расширения)\n  --file              строки key=value: настройки ниже, с приоритетом над таблицей конфигурации\n  --uuid              uuid этого узла (по умолчанию тот, что он хранит в таблице конфигурации)\n  -v, -q              отладка или только предупреждения; -h этот текст, -V версия\n"
lite-usage-settings: "Настройки - строка `name=value` в --file или строка таблицы конфигурации, модуль L:\n  upper       узлы вышестоящего кластера (http://host:port), через запятую; пробуются по очереди\n  upper_root  корень вышестоящего кластера, SHA256:... - его CA, как его печатает там\n              `ytctl --skv-status`; от этого кластера принимается только то, что ведет к нему\n  cluster_db  имя этой базы данных в вышестоящем кластере (по умолчанию ее собственное)\n  key_dir     где этот узел хранит свой CA (по умолчанию ~/.yt-lite/<uuid этого узла>)\n  lang        язык его сообщений: en, ru, fr, de, zh или ja (по умолчанию язык базы данных)\n  migrate     каталог схем sge (S<версия>__имя.yaml) и скриптов, применяемых при старте;\n              каждая названная в них таблица с первичным ключом затем синхронизируется (yt_setup)\n\n  INSERT INTO yt_config (name, module, value) VALUES ('upper', 'L', 'http://node1:7421');\n"
lite-usage-link: "Без az: у легкого узла нет az, и задать его нельзя. Узел, через который он входит, считает его\nузлом своего az - какого, показывает yt_info, - и передает ему то, что хранит этот az.\n\nСвязь: вышестоящий кластер допускает этот узел по его CA, созданному при первом запуске. Оператор\nкластера одобряет этот CA на лидере кластера после того, как узел вошел: `ytctl\n--skv-approve <uuid> --fingerprint <fp>` - отпечаток yt-lite пишет в журнал при запуске. После\nэтого кластер подписывает CA, и каждый вызов к кластеру идет по TLS.\n\nОшибки: каждая начинается со своего кода, YT-Ennn - после SQLSTATE, например 0A000:, если он\nесть; https://docs.dbinvent.com/errors/<code> объясняет ее.\n"
lite-args: "YT-E033 командная строка: %{error}"
lite-no-setting: "YT-E034 нет настройки %{name}: строка `%{name}=...` в --file или строка таблицы конфигурации, модуль L: INSERT INTO yt_config (name, module, value) VALUES ('%{name}', 'L', '...')"
lite-no-key-dir: "YT-E035 не задан key_dir и нет HOME: негде хранить CA этого узла - строка `key_dir=...` в --file или строка таблицы конфигурации, модуль L"
lite-pid-file: "YT-E036 файл pid %{file}: %{error}"
lite-another-node: "YT-E037 другой узел обслуживает %{socket}: процесс %{pid} (его файл pid %{file})"
lite-pid-race: "YT-E038 файл pid %{file}: его в тот же момент занял другой запуск"
lite-socket: "YT-E039 unix-сокет: %{error}"
lite-socket-stopped: "YT-E040 сервер unix-сокета остановлен: %{error}"
lite-ca: "YT-E041 CA этого узла: %{error}"
lite-no-root: "YT-E042 не задан upper_root: от вышестоящего кластера ничего не принимается, поэтому TLS к нему нет - задайте SHA256:... его CA, как его печатает там `ytctl --skv-status`"
lite-start: "yt-lite %{version}: лист кластера %{hosts}"
lite-ca-line: "CA этого узла %{fingerprint} (хранится в %{dir}): вышестоящий кластер одобряет его на своем лидере - ytctl --skv-approve %{uuid} --fingerprint %{fingerprint}"
lite-tls-line: "TLS связи: %{status}"
lite-serving: "обслуживает базу данных %{db} (в вышестоящем кластере - %{cluster_db}) через %{socket}, узел %{uuid}"
lite-stopped: "yt-lite остановлен: %{why}"
lite-signal-interrupt: "прерывание"
lite-signal-terminate: "завершение"
lite-signal-hangup: "отключение терминала"
lite-signal-none: "нет обработчика сигналов"

