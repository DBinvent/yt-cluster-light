lite-deliver-failed: "YT-E048 上位クラスターへの配送: %{error}"
lite-resolve-failed: "YT-E049 準備済みトランザクションの決着: %{error}"
lite-sweep-failed: "YT-E050 未完了のトランザクション: %{error}"
lite-signin-refused: "YT-E051 上位クラスターがサインインを拒否しました: %{reason}"
lite-signin-failed: "YT-E052 上位クラスターへのサインイン: %{error}"
lite-tls-problem: "YT-E053 リンクの TLS: %{error}"
lite-tls-news: "リンクの TLS: %{text}"
lite-fine-again: "%{what}: 再び正常"
lite-settled: "準備済みトランザクション %{count} 件を、データベースが決めたとおりに決着させました"
lite-swept: "ここで準備されなかったトランザクション: %{sent} 件をコミットして送信、%{dropped} 件を破棄"
lite-signed-in-flat: "上位クラスターにサインインしました: az はありません"
lite-signed-in-az: "上位クラスターにサインインしました: az %{az} のノードとして扱われます。サインイン先ノードの az です"

