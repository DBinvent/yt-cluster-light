lite-sqlite-no-upper: "YT-E083 リンク先の上位クラスタがありません: upper を設定する (yt_config、モジュール L) か、yt_link(upper, upper_root) を呼び出してください"
lite-sqlite-in-tx: "YT-E084 トランザクション内の yt_link: ロールバックするとリンクの実行中にその設定とこのノードの uuid が失われます - トランザクションの外で呼び出してください"
lite-sync-value: "YT-E085 %{value} は A 行の値ではありません: ytctl --encode-table-cfg が出力する値を指定するか、双方向なら何も指定しないでください"
