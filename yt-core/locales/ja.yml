_version: 1
# [i18n] yt-core's messages in Japanese: one file per language (en, ru, and - not reviewed -
# fr, de, zh, ja), every key in each. An error's message starts with its code, the same in
# every language (src/i18n.rs tests it) - after a SQLSTATE such as 0A000: when it has one,
# which the extension reads at position 0. YT lite's codes have three digits, YT-Ennn:
# yt-core-proto YT-E001 to YT-E029, yt-core YT-E030 and up. YT Cluster's own have four,
# YT-Ennnn. ytserv reads these files too, by symlink (its locales/lite.<lang>.yml): what a
# shared link file says is the same there, under the same code.

# === the shared link files (src/core/signin.rs, route.rs): the lite node and ytserv ===
link-no-target-above: "YT-E030 上位クラスターのノードがないため、サインインできません"
link-no-target-az: "YT-E031 az %{az} のサインイン先となるノードがありません"
# the dial rules' reasons: the tail of the message that refuses a dial - no code of their own
link-rule-lower: "LOWER のクラスターには決してダイヤルしません: あちらが私たちにサインインし、私たちはそのためのアドレスではなく検証鍵を保持しています"
link-rule-upper-member: "ルール 1: 上位への接続をダイヤルできるのはこのクラスターの leader だけです。メンバーは境界をまたいでダイヤルする先を持ちません"
link-rule-upper-leader: "ルール 1: 上位へのリンクは上位クラスターの leader を避けなければなりません - 通常のノードを選んでください"
link-rule-neighbor: "ルール 2: 隣接リンクは leader 同士の間だけです"

# === the lite node (src/core/store.rs, calls.rs) ===
lite-leaf-no-down: "YT-E032 lite ノードはリーフです: そこから下へ何も流れません"
# a call's failure, the tail of the message that names the turn - no code of their own
lite-call-tls: "%{host} (TLS): %{error}"
lite-call-then-plaintext: "%{first} - その後は平文: %{error}"

# === yt-lite: its command line and its start (src/main.rs) ===
lite-usage-about: "yt-lite - YT lite: この PostgreSQL インスタンスの 1 つのデータベース向けの YT ノードで、YT クラスターのリーフです。\nyt_cluster 拡張の unix ソケットを提供し、上位クラスターが受け取るまでデータベースがコミットした内容を保持し、\n下りてきたものを適用します。\n"
lite-usage-args: "  yt-lite [--db] <url> [--config <schema.table>] [--file <file>] [--uuid <uuid>] [-v | -q]\n\n  <url>               このインスタンスの unix ソケット越しに提供するデータベース:\n                      postgresql://postgres@localhost/appdb?host=/var/run/postgresql\n  --config            その設定テーブル (既定値は拡張の yt_config)\n  --file              key=value の行: 下の設定を、設定テーブルより先に読み込みます\n  --uuid              このノードの uuid (既定値は設定テーブルに保存されているもの)\n  -v, -q              デバッグ、または警告のみ。-h はこのテキスト、-V はバージョン\n"
lite-usage-settings: "設定 - --file の `name=value` の行、または設定テーブルの行 (モジュール L):\n  upper       ダイヤルする上位クラスターのノード (http://host:port)、カンマ区切り、順に試します\n  upper_root  上位クラスターのルート SHA256:... - その CA。`ytctl --skv-status` がそこに表示するとおり\n              それにチェーンするものだけを、そのクラスターから受け取ります\n  cluster_db  上位クラスターでのこのデータベースの名前 (既定値は同じ名前)\n  key_dir     このノードが CA を保持する場所 (既定値は ~/.yt-lite/<このノードの uuid>)\n  lang        メッセージの言語: en, ru, fr, de, zh または ja (既定値はデータベースのもの)\n  migrate     sge のスキーマ（S<バージョン>__名前.yaml）とスクリプトのディレクトリ。起動時に適用し、\n              主キーを持つ各テーブルを同期に設定します（yt_setup）\n\n  INSERT INTO yt_config (name, module, value) VALUES ('upper', 'L', 'http://node1:7421');\n"
lite-usage-link: "az なし: lite ノードは設定する az を持ちません。サインイン先のノードがそれを自分の az のノードとして扱い、\nその az が保持するものを送ります (どの az かは yt_info に表示されます)。\n\nリンク: 上位クラスターは、最初の起動時に作られたこのノードの CA によってこのノードを受け入れます。上位クラスターの\n運用者は、このノードがサインインした後、クラスターの leader でその CA を承認します - `ytctl\n--skv-approve <uuid> --fingerprint <fp>` (fingerprint は yt-lite が起動時にログへ出力したもの)。その後\nクラスターがそれに連署し、そこへのすべての呼び出しは TLS になります。\n\nエラー: 各メッセージは YT-Ennn のコードで始まります - SQLSTATE がある場合 (例: 0A000:) はその後ろに続きます。\nhttps://docs.dbinvent.com/errors/<code> で説明されています。\n"
lite-args: "YT-E033 コマンドライン: %{error}"
lite-no-setting: "YT-E034 設定 %{name} がありません: --file の `%{name}=...` の行、または設定テーブルの行 (モジュール L) が必要です: INSERT INTO yt_config (name, module, value) VALUES ('%{name}', 'L', '...')"
lite-no-key-dir: "YT-E035 key_dir が設定されておらず、HOME もありません: このノードの CA をどこに保持するか - --file の `key_dir=...` の行、または設定テーブルの行 (モジュール L)"
lite-pid-file: "YT-E036 pid ファイル %{file}: %{error}"
lite-another-node: "YT-E037 別のノードが %{socket} を提供しています: プロセス %{pid} (その pid ファイル %{file})"
lite-pid-race: "YT-E038 pid ファイル %{file}: 同時に起動した別の起動が取得しました"
lite-socket: "YT-E039 unix ソケット: %{error}"
lite-socket-stopped: "YT-E040 unix ソケットサーバーが停止しました: %{error}"
lite-ca: "YT-E041 このノードの CA: %{error}"
lite-no-root: "YT-E042 upper_root が設定されていません: 上位クラスターから渡されるものは何も受け取られないため、そこへの TLS はありません - 上位クラスターの CA の SHA256:... を設定してください。`ytctl --skv-status` がそこに表示するとおりです"
lite-start: "yt-lite %{version}: %{hosts} にあるクラスターのリーフ"
lite-ca-line: "このノードの CA %{fingerprint} (%{dir} に保持): 上位クラスターがその leader で承認します - ytctl --skv-approve %{uuid} --fingerprint %{fingerprint}"
lite-tls-line: "リンクの TLS: %{status}"
lite-serving: "データベース %{db} を提供中 (上位では %{cluster_db})、%{socket} 上、ノード %{uuid}"
lite-stopped: "yt-lite が停止しました: %{why}"
lite-signal-interrupt: "割り込み"
lite-signal-terminate: "終了"
lite-signal-hangup: "ハングアップ"
lite-signal-none: "シグナルハンドラーなし"

