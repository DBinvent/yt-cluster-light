lite-info-az-none: "none: 上位クラスターには az がありません"
lite-info-az-shared: "%{az} - 上位ノードのもので共有; lite ノードは独自のものを持ちません"
lite-info-az-untold: "まだ通知されていません: サインインが許可されていません"
lite-info-lite: "YT lite: 1 つのデータベース、YT クラスターのリーフ"

