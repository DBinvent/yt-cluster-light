lite-leader-before-link: "YT-E078 上位クラスターがサインインを拒否しました: %{reason} - そのリーダーは 1.21 より前の YT Cluster を実行しており、ライトノードを受け入れません。サインインは再試行され、リーダーが 1.21 以降になると通ります"
