lite-row-no-table: "YT-E055 テーブルのない行"
lite-one-database: "0A000: YT-E056 YT lite は 1 つのデータベース (%{db}) を提供します。インスタンス内の複数データベースには完全版が必要です"
lite-full-version: "0A000: YT-E057 %{what} には YT Cluster の完全版が必要です"
lite-unknown-completion: "YT-E058 不明な完了指定 %{value}"
lite-complete-failed: "YT-E059 complete tx=%{tx}: %{error}"
lite-modify-refused: "modify: %{why} - %{table} の行"
