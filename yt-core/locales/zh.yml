light-chmod: "YT-E054 无法对 %{path} 执行 chmod 0777：%{error}"
light-row-no-table: "YT-E055 一行没有其所属的表"
light-one-database: "0A000: YT-E056 YT light 只服务一个数据库（%{db}）；每个实例服务多个数据库需要完整版本"
light-full-version: "0A000: YT-E057 %{what} 需要 YT Cluster 的完整版本"
