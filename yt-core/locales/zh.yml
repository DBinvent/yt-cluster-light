# === the CA and the link's TLS (src/tls.rs) ===
light-tls-internal: "YT-E069 TLS，%{what}：%{error}"
light-file: "YT-E070 %{path}：%{error}"
light-ca-mismatch: "YT-E071 %{dir}：ca.crt 不是 ca.key 的证书"
light-ca-key-lost: "YT-E072 %{dir}：有 ca.crt 但没有 ca.key - CA 密钥已丢失：请将 ca.crt 移开以生成新的 CA，上层集群会再次批准它"
light-ca-no-key: "YT-E073 该 CA 没有密钥"
light-root-not-pinned: "YT-E074 未为上层集群固定根（设置 upper_root：其 CA 的 SHA256:...，如 `ytctl --skv-status` 在那里打印的）- 它交付的任何内容都不被采信，因此无法建立到它的 TLS"
light-root-no-chain: "YT-E075 上层集群交付的根中没有任何一个链接到已固定的根（%{pin}） - 未采信"
light-ca-not-ours: "YT-E076 来自上层集群、经其签署的 CA 不是本节点的，或不链接到其任何根 - 未采信"
light-no-link-service: "YT-E077 %{host} 没有 Link 服务：它是 1.21 之前的 YT Cluster 节点，轻量节点无法通过它登录，或者根本不是 YT Cluster 节点 - 将尝试 upper 中的下一个节点"
light-leader-before-link: "YT-E078 上层集群拒绝了登录：%{reason} - 其领导节点运行的是 1.21 之前的 YT Cluster，不接纳轻量节点；登录会重试，待该领导节点运行 1.21 或更高版本后即可通过"
light-turso-no-table: "YT-E079 此数据库中没有表 %{table}"
light-turso-no-key: "YT-E080 %{table} 没有主键：其行经由链路传输的表需要主键"
light-turso-value: "YT-E081 %{value} 不是声明为 %{decl} 的列的值"
light-sqlite-no-file: "YT-E082 数据库 %{db} 没有文件 - 在内存中或是临时的 - 无法链接：请从文件打开一个数据库"
light-sqlite-no-upper: "YT-E083 没有可链接的上层集群：请设置 upper（yt_config，模块 L），或调用 yt_link(upper, upper_root)"
light-sqlite-in-tx: "YT-E084 在事务中调用 yt_link：回滚会在链接运行时带走其设置和本节点的 uuid - 请在事务之外调用"
light-sync-value: "YT-E085 %{value} 不是 A 行的值：请给出 ytctl --encode-table-cfg 打印的值，或留空表示双向"
light-sqlite-bad-root: "YT-E086 upper_root %{value} 不是 CA 指纹：应为 SHA256: 加 43 个字符，如 ytctl --skv-status 所打印"
light-tls-status-ready: "已由上层集群签署，持有 %{count} 个根：调用使用 TLS"
light-tls-status-no-pin: "未固定 upper_root：上层集群交付的任何内容都不被采信"
light-tls-status-waiting: "等待上层集群批准并签署它"
light-tls-countersigned: "本节点的 CA 已由上层集群签署"
light-tls-roots-held: "已持有上层集群的 %{count} 个根"
