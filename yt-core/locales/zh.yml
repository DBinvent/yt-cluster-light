light-db-url: "YT-E060 数据库 url：%{error}"
light-db-connect: "YT-E061 连接数据库：%{error}"
light-db: "YT-E062 数据库，%{what}：%{error}"
light-uuid-row: "YT-E063 配置表中的行 `uuid`，模块 L：%{error}"
light-no-attnum: "YT-E064 %{table}：没有 attnum 为 %{attnum} 的列"
light-no-column: "YT-E065 %{table}：此处没有列 %{column}"
light-keyless-no-old: "YT-E066 %{table}：没有键的表中的一行，且没有其旧映像"
