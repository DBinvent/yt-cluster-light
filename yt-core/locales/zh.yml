light-complete-failed: "YT-E059 完成 tx=%{tx}：%{error}"
light-modify-refused: "modify: %{why} - %{table} 中的一行"
light-info-refused: "info: '%{what}' 被拒绝 - 属于完整版本"
light-info-az-none: "none: 上层集群没有 az"
light-info-az-shared: "%{az} - 上层节点的 az，共享；light 节点没有自己的 az"
light-info-az-untold: "尚未告知：未授予登录"
light-info-light: "YT light：一个数据库，是 YT 集群的叶子节点"

