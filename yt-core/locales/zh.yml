light-ask-failed: "YT-E043 询问上层集群的位置：%{error}"
light-fetch-failed: "YT-E044 从上层集群获取：%{error} - 接下来尝试下一个节点"
light-apply-failed: "YT-E045 应用来自上层集群的一批数据：%{error} - 下一轮再试"
light-collect-failed: "YT-E046 收集需要上送的内容：%{error}"
light-batch-refused: "YT-E047 上层集群拒绝了一批数据：%{error}"
light-deliver-failed: "YT-E048 向上层集群投递：%{error}"
light-resolve-failed: "YT-E049 结算已预备的事务：%{error}"
light-sweep-failed: "YT-E050 未结束的事务：%{error}"
light-signin-refused: "YT-E051 上层集群拒绝了登录：%{reason}"
light-signin-failed: "YT-E052 登录上层集群：%{error}"
light-tls-problem: "YT-E053 链接 TLS：%{error}"
light-tls-news: "链接 TLS：%{text}"
light-fine-again: "%{what}：已恢复正常"
light-settled: "%{count} 个已预备的事务已按其所在数据库的决定结算"
light-swept: "从未在此预备的事务：%{sent} 个已提交并发送；%{dropped} 个已丢弃"
light-signed-in-flat: "已登录上层集群：它没有 az"
light-signed-in-az: "已登录上层集群：被当作 az %{az} 中的节点接收，该 az 即登录所经由的节点的 az"

