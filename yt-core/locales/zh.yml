_version: 1
# [i18n] yt-core's messages in Chinese: one file per language (en, ru, and - not reviewed -
# fr, de, zh, ja), every key in each. An error's message starts with its code, the same in
# every language (src/i18n.rs tests it) - after a SQLSTATE such as 0A000: when it has one,
# which the extension reads at position 0. YT light's codes have three digits, YT-Ennn:
# yt-core-proto YT-E001 to YT-E029, yt-core YT-E030 and up. YT Cluster's own have four,
# YT-Ennnn. ytserv reads these files too, by symlink (its locales/light.<lang>.yml): what a
# shared link file says is the same there, under the same code.

# === the shared link files (src/core/signin.rs, route.rs): the light node and ytserv ===
link-no-target-above: "YT-E030 上层集群中没有可供登录的节点"
link-no-target-az: "YT-E031 az %{az} 中没有可供登录的节点"
# the dial rules' reasons: the tail of the message that refuses a dial - no code of their own
link-rule-lower: "不向 LOWER 集群拨号：它向我们登录，而我们持有的是它的验证密钥，而不是它的地址"
link-rule-upper-member: "规则 1：只有本集群的 leader 向上拨号；成员没有任何需要跨越边界拨号的内容"
link-rule-upper-leader: "规则 1：向上的链接必须避开上层集群的 leader - 请选择普通节点"
link-rule-neighbor: "规则 2：相邻链接只允许 leader 到 leader"

# === the light node (src/core/store.rs, calls.rs) ===
light-leaf-no-down: "YT-E032 light 节点是叶子节点：不向下传递任何内容"
# a call's failure, the tail of the message that names the turn - no code of their own
light-call-tls: "%{host} (TLS): %{error}"
light-call-then-plaintext: "%{first} - 然后使用明文: %{error}"

# === yt-light: its command line and its start (src/main.rs) ===
light-usage-about: "yt-light - YT light：这是服务于本 PostgreSQL 实例中一个数据库的 YT 节点，是 YT 集群的叶子节点。\n它为 yt_cluster 扩展提供 unix 套接字服务，保留数据库已提交但上层集群尚未拿到的内容，\n并应用从上层下发的内容。\n"
light-usage-args: "  yt-light [--db] <url> [--config <schema.table>] [--file <file>] [--uuid <uuid>] [-v | -q]\n\n  <url>               它服务的数据库，经由实例的 unix 套接字：\n                      postgresql://postgres@localhost/appdb?host=/var/run/postgresql\n  --config            其配置表（默认：扩展的 yt_config）\n  --file              key=value 行：下面的设置，位于配置表之前\n  --uuid              本节点的 uuid（默认：它在配置表中保存的那个）\n  -v, -q              调试，或仅警告；-h 显示本文本，-V 显示版本\n"
light-usage-settings: "设置 - --file 中的一行 `name=value`，或配置表中的一行，模块 L：\n  upper       要拨号的上层集群节点（http://host:port），以逗号分隔，依次尝试\n  upper_root  上层集群的根，SHA256:... - 即其 CA，如 `ytctl --skv-status` 所打印的\n              在那里；仅采信链接到它的内容，且只取自该集群\n  cluster_db  本数据库在上层集群中的名称（默认：与自身相同）\n  key_dir     本节点保存其 CA 的位置（默认：~/.yt-light/<本节点的 uuid>）\n  lang        其消息的语言：en, ru, fr, de, zh 或 ja（默认：数据库的语言）\n\n  INSERT INTO yt_config (name, module, value) VALUES ('upper', 'L', 'http://node1:7421');\n"
light-usage-link: "无 az：light 节点无需设置 az。它登录所经由的节点会把它当作自己的 az 中的一个节点\n（yt_info 显示是哪一个），并把该 az 所持有的内容发给它。\n\n链接：上层集群凭其 CA 接纳本节点，该 CA 在首次启动时生成。本节点登录后，其操作员在集群的\nleader 上批准该 CA：`ytctl\n--skv-approve <uuid> --fingerprint <fp>`，指纹由 yt-light 在启动时记录。随后\n集群为其签署，此后对它的每次调用都是 TLS。\n\n错误：每条都以代码开头，YT-Ennn - 其前有 SQLSTATE（如 0A000:）时，代码位于其后；\nhttps://docs.dbinvent.com/errors/<code> 对其作出解释。\n"
light-args: "YT-E033 命令行：%{error}"
light-no-setting: "YT-E034 没有设置 %{name}：--file 中的一行 `%{name}=...`，或配置表中的一行，模块 L：INSERT INTO yt_config (name, module, value) VALUES ('%{name}', 'L', '...')"
light-no-key-dir: "YT-E035 未设置 key_dir 且没有 HOME：本节点保存其 CA 的位置 - --file 中的一行 `key_dir=...`，或配置表中的一行，模块 L"
light-pid-file: "YT-E036 pid 文件 %{file}：%{error}"
light-another-node: "YT-E037 另一个节点正在服务 %{socket}：进程 %{pid}（其 pid 文件 %{file}）"
light-pid-race: "YT-E038 pid 文件 %{file}：被同时启动的另一次启动占用"
light-socket: "YT-E039 unix 套接字：%{error}"
light-socket-stopped: "YT-E040 unix 套接字服务已停止：%{error}"
light-ca: "YT-E041 本节点的 CA：%{error}"
light-no-root: "YT-E042 未设置 upper_root：上层集群交付的任何内容都不被采信，因此无法建立到它的 TLS - 请设置其 CA 的 SHA256:...，如 `ytctl --skv-status` 在那里打印的"
light-start: "yt-light %{version}：位于 %{hosts} 的集群的叶子节点"
light-ca-line: "本节点的 CA %{fingerprint}（保存于 %{dir}）：上层集群在其 leader 上批准它 - ytctl --skv-approve %{uuid} --fingerprint %{fingerprint}"
light-tls-line: "链接 TLS：%{status}"
light-serving: "正在服务数据库 %{db}（上层为 %{cluster_db}），位于 %{socket}，节点 %{uuid}"
light-stopped: "yt-light 已停止：%{why}"
light-signal-interrupt: "中断"
light-signal-terminate: "终止"
light-signal-hangup: "挂起"
light-signal-none: "没有信号处理程序"

