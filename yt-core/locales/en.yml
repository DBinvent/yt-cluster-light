lite-ca-key-lost: "YT-E072 %{dir}: ca.crt with no ca.key - the CA key is lost: move ca.crt away to make a new CA, which the cluster above approves again"
lite-ca-no-key: "YT-E073 the CA has no key"
lite-root-not-pinned: "YT-E074 no root pinned for the cluster above (setting upper_root: the SHA256:... of its CA, as `ytctl --skv-status` prints it there) - nothing it hands over is taken, so no TLS to it"
lite-root-no-chain: "YT-E075 no root the cluster above handed over chains to the one pinned (%{pin}) - not taken"
lite-ca-not-ours: "YT-E076 the countersigned CA from the cluster above is not this node's, or chains to none of its roots - not taken"
lite-no-link-service: "YT-E077 %{host} has no Link service: a node of YT Cluster before 1.21, which a lite node cannot sign in through, or no YT Cluster node at all - the next node of upper is tried"
lite-leader-before-link: "YT-E078 the cluster above refused the sign-in: %{reason} - its leader runs YT Cluster before 1.21, which admits no lite node; the sign-in is tried again, and goes through once that leader runs 1.21 or later"
lite-turso-no-table: "YT-E079 no table %{table} in this database"
