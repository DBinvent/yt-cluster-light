lite-collect-failed: "YT-E046 collecting what goes up: %{error}"
lite-batch-refused: "YT-E047 the cluster above refused a batch: %{error}"
lite-deliver-failed: "YT-E048 delivering to the cluster above: %{error}"
lite-resolve-failed: "YT-E049 settling prepared transactions: %{error}"
lite-sweep-failed: "YT-E050 open transactions: %{error}"
lite-signin-refused: "YT-E051 the cluster above refused the sign-in: %{reason}"
lite-signin-failed: "YT-E052 sign-in to the cluster above: %{error}"
lite-tls-problem: "YT-E053 link TLS: %{error}"
lite-tls-news: "link TLS: %{text}"
lite-fine-again: "%{what}: fine again"
lite-settled: "%{count} prepared transaction(s) settled as their database decided them"
lite-swept: "transactions that never prepared here: %{sent} committed, sent; %{dropped} dropped"
lite-signed-in-flat: "signed in to the cluster above: it has no azs"
