_version: 1
# [i18n] yt-core's messages in English: one file per language (en, ru, and - not reviewed -
# fr, de, zh, ja), every key in each. An error's message starts with its code, the same in
# every language (src/i18n.rs tests it) - after a SQLSTATE such as 0A000: when it has one,
# which the extension reads at position 0. YT lite's codes have three digits, YT-Ennn:
# yt-core-proto YT-E001 to YT-E029, yt-core YT-E030 and up. YT Cluster's own have four,
# YT-Ennnn. ytserv reads these files too, by symlink (its locales/lite.<lang>.yml): what a
# shared link file says is the same there, under the same code.

# === the shared link files (src/core/signin.rs, route.rs): the lite node and ytserv ===
link-no-target-above: "YT-E030 no node of the cluster above to sign in through"
link-no-target-az: "YT-E031 no node of az %{az} to sign in through"
# the dial rules' reasons: the tail of the message that refuses a dial - no code of their own
link-rule-lower: "a LOWER cluster is never dialled: it signs in to us, and we hold a verification key for it rather than an address"
link-rule-upper-member: "rule 1: only this cluster's leader dials upward; a member has nothing to dial across a boundary"
link-rule-upper-leader: "rule 1: an upward link must avoid the upper cluster's leader - pick a regular node"
link-rule-neighbor: "rule 2: a neighbour link is leader-to-leader only"

# === the lite node (src/core/store.rs, calls.rs) ===
lite-leaf-no-down: "YT-E032 a lite node is a leaf: nothing goes down from it"
# a call's failure, the tail of the message that names the turn - no code of their own
lite-call-tls: "%{host} (TLS): %{error}"
lite-call-then-plaintext: "%{first} - then plaintext: %{error}"

# === yt-lite: its command line and its start (src/main.rs) ===
lite-usage-about: "yt-lite - YT lite: a YT node for one database of this PostgreSQL instance, a leaf of a\nYT cluster. It serves the yt_cluster extension's unix socket, keeps what the database\ncommits until the cluster above has it, and applies what comes down.\n"
lite-usage-args: "  yt-lite [--db] <url> [--config <schema.table>] [--file <file>] [--uuid <uuid>] [-v | -q]\n\n  <url>               the database it serves, over the instance's unix socket:\n                      postgresql://postgres@localhost/appdb?host=/var/run/postgresql\n  --config            its config table (default: the extension's yt_config)\n  --file              key=value lines: the settings below, ahead of the config table's\n  --uuid              this node's uuid (default: the one it keeps in the config table)\n  -v, -q              debug, or warnings only; -h this text, -V the version\n"
lite-usage-settings: "Settings - a line `name=value` of --file, or a row of the config table, module L:\n  upper       nodes of the cluster above to dial (http://host:port), comma separated, tried in turn\n  upper_root  the root of the cluster above, SHA256:... - its CA, as `ytctl --skv-status` prints\n              it there; only what chains to it is taken from that cluster\n  cluster_db  this database's name in the cluster above (default: its own)\n  key_dir     where this node keeps its CA (default: ~/.yt-lite/<this node's uuid>)\n  lang        the language of its messages: en, ru, fr, de, zh or ja (default: the database's)\n\n  INSERT INTO yt_config (name, module, value) VALUES ('upper', 'L', 'http://node1:7421');\n"
lite-usage-link: "No az: a lite node has none to set. The node it signs in through takes it for a node of\nits own az - yt_info shows which - and sends it what that az holds.\n\nThe link: the cluster above admits this node by its CA, made at the first start. Its\noperator approves the CA on the cluster's leader once this node signed in - `ytctl\n--skv-approve <uuid> --fingerprint <fp>`, the fingerprint yt-lite logs at its start. Then\nthe cluster countersigns it, and every call to it is TLS.\n\nErrors: each starts with its code, YT-Ennn - after a SQLSTATE such as 0A000: when it has\none; https://docs.dbinvent.com/errors/<code> explains it.\n"
lite-args: "YT-E033 the command line: %{error}"
lite-no-setting: "YT-E034 no setting %{name}: a line `%{name}=...` of --file, or a row of the config table, module L: INSERT INTO yt_config (name, module, value) VALUES ('%{name}', 'L', '...')"
lite-no-key-dir: "YT-E035 no key_dir set and no HOME: where to keep this node's CA - a line `key_dir=...` of --file, or a row of the config table, module L"
lite-pid-file: "YT-E036 the pid file %{file}: %{error}"
lite-another-node: "YT-E037 another node serves %{socket}: process %{pid} (its pid file %{file})"
lite-pid-race: "YT-E038 the pid file %{file}: taken by another start at the same time"
lite-socket: "YT-E039 the unix socket: %{error}"
lite-socket-stopped: "YT-E040 the unix socket server stopped: %{error}"
lite-ca: "YT-E041 this node's CA: %{error}"
lite-no-root: "YT-E042 no upper_root set: nothing the cluster above hands over is taken, so no TLS to it - set the SHA256:... of its CA, as `ytctl --skv-status` prints it there"
lite-start: "yt-lite %{version}: a leaf of the cluster at %{hosts}"
lite-ca-line: "this node's CA %{fingerprint} (kept in %{dir}): the cluster above approves it on its leader - ytctl --skv-approve %{uuid} --fingerprint %{fingerprint}"
lite-tls-line: "link TLS: %{status}"
lite-serving: "serving database %{db} (as %{cluster_db} above) on %{socket}, node %{uuid}"
lite-stopped: "yt-lite stopped: %{why}"
lite-signal-interrupt: "interrupt"
lite-signal-terminate: "terminate"
lite-signal-hangup: "hangup"
lite-signal-none: "no signal handler"

