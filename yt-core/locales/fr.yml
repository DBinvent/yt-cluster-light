_version: 1
# [i18n] yt-core's messages in French: one file per language (en, ru, and - not reviewed -
# fr, de, zh, ja), every key in each. An error's message starts with its code, the same in
# every language (src/i18n.rs tests it) - after a SQLSTATE such as 0A000: when it has one,
# which the extension reads at position 0. YT lite's codes have three digits, YT-Ennn:
# yt-core-proto YT-E001 to YT-E029, yt-core YT-E030 and up. YT Cluster's own have four,
# YT-Ennnn. ytserv reads these files too, by symlink (its locales/lite.<lang>.yml): what a
# shared link file says is the same there, under the same code.

# === the shared link files (src/core/signin.rs, route.rs): the lite node and ytserv ===
link-no-target-above: "YT-E030 aucun nœud du cluster au-dessus pour se connecter"
link-no-target-az: "YT-E031 aucun nœud de az %{az} pour se connecter"
# the dial rules' reasons: the tail of the message that refuses a dial - no code of their own
link-rule-lower: "un cluster LOWER n'est jamais appelé : il se connecte à nous, et nous détenons pour lui une clé de vérification plutôt qu'une adresse"
link-rule-upper-member: "règle 1 : seul le leader de ce cluster appelle vers le haut ; un membre n'a rien à appeler au-delà d'une frontière"
link-rule-upper-leader: "règle 1 : un lien vers le haut doit éviter le leader du cluster supérieur - choisissez un nœud ordinaire"
link-rule-neighbor: "règle 2 : un lien de voisinage ne va que de leader à leader"

# === the lite node (src/core/store.rs, calls.rs) ===
lite-leaf-no-down: "YT-E032 un nœud lite est une feuille : rien ne descend depuis lui"
# a call's failure, the tail of the message that names the turn - no code of their own
lite-call-tls: "%{host} (TLS): %{error}"
lite-call-then-plaintext: "%{first} - puis en clair: %{error}"

# === yt-lite: its command line and its start (src/main.rs) ===
lite-usage-about: "yt-lite - YT lite: un nœud YT pour une base de cette instance PostgreSQL, une feuille\nd'un cluster YT. Il sert le socket unix de l'extension yt_cluster, garde ce que la base\nvalide jusqu'à ce que le cluster au-dessus l'ait, et applique ce qui descend.\n"
lite-usage-args: "  yt-lite [--db] <url> [--config <schema.table>] [--file <file>] [--uuid <uuid>] [-v | -q]\n\n  <url>               la base qu'il sert, par le socket unix de l'instance :\n                      postgresql://postgres@localhost/appdb?host=/var/run/postgresql\n  --config            sa table de configuration (par défaut : yt_config de l'extension)\n  --file              des lignes clé=valeur : les réglages ci-dessous, avant la table\n  --uuid              l'uuid de ce nœud (défaut : celui de la table de configuration)\n  -v, -q              débogage, ou avertissements seulement ; -h ce texte, -V la version\n"
lite-usage-settings: "Réglages - une ligne `name=value` de --file, ou une ligne de la table de configuration, module L :\n  upper       nœuds du cluster au-dessus (http://host:port), séparés par ',', essayés en ordre\n  upper_root  racine du cluster au-dessus, SHA256:... de son CA, affiché par `ytctl --skv-status`\n              là-bas ; seul ce qui s'y rattache est pris de ce cluster\n  cluster_db  nom de cette base dans le cluster au-dessus (par défaut : le sien)\n  key_dir     où ce nœud garde son CA (par défaut : ~/.yt-lite/<uuid de ce nœud>)\n  lang        la langue de ses messages : en, ru, fr, de, zh ou ja (par défaut : celle de la base)\n\n  INSERT INTO yt_config (name, module, value) VALUES ('upper', 'L', 'http://node1:7421');\n"
lite-usage-link: "Pas d'az : un nœud lite n'en a aucune à fixer. Le nœud par lequel il se connecte le prend\npour un nœud de sa propre az - yt_info indique laquelle - et lui envoie ce que cette az contient.\n\nLe lien : le cluster au-dessus admet ce nœud par son CA, créé au premier démarrage. Son opérateur\napprouve le CA sur le leader du cluster une fois que ce nœud s'est connecté - `ytctl\n--skv-approve <uuid> --fingerprint <fp>`, l'empreinte que yt-lite journalise au démarrage. Ensuite\nle cluster la contresigne, et chaque appel vers lui se fait en TLS.\n\nErreurs : chacune commence par son code, YT-Ennn - après un SQLSTATE tel que 0A000: s'il y en a un ;\nhttps://docs.dbinvent.com/errors/<code> l'explique.\n"
lite-args: "YT-E033 la ligne de commande : %{error}"
lite-no-setting: "YT-E034 aucun réglage %{name} : une ligne `%{name}=...` de --file, ou une ligne de la table de configuration, module L : INSERT INTO yt_config (name, module, value) VALUES ('%{name}', 'L', '...')"
lite-no-key-dir: "YT-E035 key_dir n'est pas défini et il n'y a pas de HOME : où garder le CA de ce nœud - une ligne `key_dir=...` de --file, ou une ligne de la table de configuration, module L"
lite-pid-file: "YT-E036 le fichier pid %{file} : %{error}"
lite-another-node: "YT-E037 un autre nœud sert %{socket} : processus %{pid} (son fichier pid %{file})"
lite-pid-race: "YT-E038 le fichier pid %{file} : pris par un autre démarrage en même temps"
lite-socket: "YT-E039 le socket unix : %{error}"
lite-socket-stopped: "YT-E040 le serveur du socket unix s'est arrêté : %{error}"
lite-ca: "YT-E041 le CA de ce nœud : %{error}"
lite-no-root: "YT-E042 upper_root n'est pas défini : rien de ce que le cluster au-dessus remet n'est pris, donc pas de TLS vers lui - indiquez le SHA256:... de son CA, tel que `ytctl --skv-status` l'affiche là-bas"
lite-start: "yt-lite %{version} : une feuille du cluster à %{hosts}"
lite-ca-line: "CA de ce nœud %{fingerprint} (gardé dans %{dir}) : le cluster au-dessus l'approuve sur son leader - ytctl --skv-approve %{uuid} --fingerprint %{fingerprint}"
lite-tls-line: "TLS du lien : %{status}"
lite-serving: "sert la base %{db} (comme %{cluster_db} au-dessus) sur %{socket}, nœud %{uuid}"
lite-stopped: "yt-lite arrêté : %{why}"
lite-signal-interrupt: "interruption"
lite-signal-terminate: "arrêt"
lite-signal-hangup: "coupure de terminal"
lite-signal-none: "aucun gestionnaire de signal"

# === yt-lite: the link to the cluster above, a turn a second (src/main.rs) ===
lite-ask-failed: "YT-E043 demande de l'adresse du cluster au-dessus : %{error}"
lite-fetch-failed: "YT-E044 récupération auprès du cluster au-dessus : %{error} - le nœud suivant ensuite"
lite-apply-failed: "YT-E045 application d'un lot du cluster au-dessus : %{error} - de nouveau au prochain tour"
lite-collect-failed: "YT-E046 collecte de ce qui monte : %{error}"
lite-batch-refused: "YT-E047 le cluster au-dessus a refusé un lot : %{error}"
lite-deliver-failed: "YT-E048 envoi vers le cluster au-dessus : %{error}"
lite-resolve-failed: "YT-E049 règlement des transactions préparées : %{error}"
lite-sweep-failed: "YT-E050 transactions ouvertes : %{error}"
lite-signin-refused: "YT-E051 le cluster au-dessus a refusé la connexion : %{reason}"
lite-signin-failed: "YT-E052 connexion au cluster au-dessus : %{error}"
lite-tls-problem: "YT-E053 TLS du lien : %{error}"
lite-tls-news: "TLS du lien : %{text}"
lite-fine-again: "%{what} : de nouveau correct"
lite-settled: "%{count} transaction(s) préparée(s) réglée(s) comme leur base les a décidées"
lite-swept: "transactions jamais préparées ici : %{sent} validées, envoyées ; %{dropped} abandonnées"
lite-signed-in-flat: "connecté au cluster au-dessus : il n'a pas d'az"
lite-signed-in-az: "connecté au cluster au-dessus : pris là-bas pour un nœud de l'az %{az}, l'az du nœud par lequel on s'est connecté"

# === the unix socket the extension calls (src/service.rs) ===
lite-chmod: "YT-E054 impossible de chmod 0777 %{path} : %{error}"
lite-row-no-table: "YT-E055 une ligne sans sa table"
lite-one-database: "0A000: YT-E056 YT lite sert une seule base (%{db}) ; plusieurs bases par instance demandent la version complète"
lite-full-version: "0A000: YT-E057 %{what} demande la version complète de YT Cluster"
lite-unknown-completion: "YT-E058 une fin inconnue %{value}"
lite-complete-failed: "YT-E059 fin tx=%{tx} : %{error}"
lite-modify-refused: "modify: %{why} - une ligne de %{table}"
lite-info-refused: "info: '%{what}' refusé - de la version complète"
lite-info-az-none: "none: le cluster au-dessus n'a pas d'az"
lite-info-az-shared: "%{az} - celle du nœud au-dessus, partagée ; un nœud lite n'en a pas de propre"
lite-info-az-untold: "pas encore communiqué : aucune connexion accordée"
lite-info-lite: "YT lite : une base, une feuille d'un cluster YT"

# === the store, PostgreSQL (src/pg.rs) ===
lite-db-url: "YT-E060 l'URL de la base : %{error}"
lite-db-connect: "YT-E061 connexion à la base : %{error}"
lite-db: "YT-E062 la base, %{what} : %{error}"
lite-uuid-row: "YT-E063 la ligne `uuid` de la table de configuration, module L : %{error}"
lite-no-attnum: "YT-E064 %{table} : aucune colonne d'attnum %{attnum}"
lite-no-column: "YT-E065 %{table} : aucune colonne %{column} ici"
lite-keyless-no-old: "YT-E066 %{table} : une ligne d'une table sans clé, et sans son ancienne image"
lite-no-key-value: "YT-E067 %{table} : aucune valeur pour la colonne de clé %{column}"
lite-statement: "YT-E068 %{sql} : %{error}"

# === the CA and the link's TLS (src/tls.rs) ===
lite-tls-internal: "YT-E069 TLS, %{what} : %{error}"
lite-file: "YT-E070 %{path} : %{error}"
lite-ca-mismatch: "YT-E071 %{dir} : ca.crt n'est pas le certificat de ca.key"
lite-ca-key-lost: "YT-E072 %{dir} : ca.crt sans ca.key - la clé du CA est perdue : déplacez ca.crt pour faire un nouveau CA, que le cluster au-dessus approuve à nouveau"
lite-ca-no-key: "YT-E073 le CA n'a pas de clé"
lite-root-not-pinned: "YT-E074 aucune racine épinglée pour le cluster au-dessus (réglage upper_root : le SHA256:... de son CA, tel que `ytctl --skv-status` l'affiche là-bas) - rien de ce qu'il remet n'est pris, donc pas de TLS vers lui"
lite-root-no-chain: "YT-E075 aucune racine remise par le cluster au-dessus ne se rattache à celle épinglée (%{pin}) - non prise"
lite-ca-not-ours: "YT-E076 le CA contresigné reçu du cluster au-dessus n'est pas celui de ce nœud, ou ne se rattache à aucune de ses racines - non pris"
lite-no-link-service: "YT-E077 %{host} n'a pas de service Link : un nœud de YT Cluster antérieur à 1.21, par lequel un nœud léger ne peut pas se connecter, ou pas du tout un nœud de YT Cluster - le nœud suivant de upper est essayé"
lite-leader-before-link: "YT-E078 le cluster au-dessus a refusé la connexion : %{reason} - son leader exécute YT Cluster antérieur à 1.21, qui n'admet aucun nœud léger ; la connexion est retentée et passera quand ce leader exécutera 1.21 ou plus récent"
lite-turso-no-table: "YT-E079 pas de table %{table} dans cette base"
lite-turso-no-key: "YT-E080 %{table} n'a pas de clé primaire : une table dont les lignes passent par le lien en a besoin"
lite-turso-value: "YT-E081 %{value} n'est pas une valeur pour une colonne déclarée %{decl}"
lite-sqlite-no-file: "YT-E082 la base %{db} n'a pas de fichier - en mémoire, ou temporaire - et ne peut pas être reliée : ouvrez-en une depuis un fichier"
lite-sqlite-no-upper: "YT-E083 aucun cluster au-dessus auquel se relier : définissez upper (yt_config, module L), ou appelez yt_link(upper, upper_root)"
lite-sqlite-in-tx: "YT-E084 yt_link dans une transaction : un rollback emporterait ses réglages et l'uuid de ce nœud pendant que le lien tourne - appelez-le hors transaction"
lite-sync-value: "YT-E085 %{value} n'est pas une valeur de ligne A : donnez celle qu'affiche ytctl --encode-table-cfg, ou aucune pour les deux sens"
lite-sqlite-bad-root: "YT-E086 upper_root %{value} n'est pas une empreinte de CA : SHA256: et 43 caractères, comme l'affiche ytctl --skv-status"
lite-tls-status-ready: "contresigné par le cluster au-dessus, %{count} racine(s) gardée(s) : les appels sont en TLS"
lite-tls-status-no-pin: "aucun upper_root épinglé : rien de ce que le cluster au-dessus remet n'est pris"
lite-tls-status-waiting: "en attente que le cluster au-dessus l'approuve et le contresigne"
lite-tls-countersigned: "CA de ce nœud contresigné par le cluster au-dessus"
lite-tls-roots-held: "%{count} racine(s) du cluster au-dessus gardée(s)"
