lite-deliver-failed: "YT-E048 Zustellen an den Cluster darüber: %{error}"
lite-resolve-failed: "YT-E049 Abschließen vorbereiteter Transaktionen: %{error}"
lite-sweep-failed: "YT-E050 offene Transaktionen: %{error}"
lite-signin-refused: "YT-E051 der Cluster darüber hat die Anmeldung abgelehnt: %{reason}"
