lite-ca-mismatch: "YT-E071 %{dir}: ca.crt ist nicht das Zertifikat von ca.key"
lite-ca-key-lost: "YT-E072 %{dir}: ca.crt ohne ca.key - der CA-Schlüssel ist verloren: ca.crt wegbewegen, um eine neue CA zu erzeugen, die der Cluster darüber erneut bestätigt"
lite-ca-no-key: "YT-E073 die CA hat keinen Schlüssel"
lite-root-not-pinned: "YT-E074 keine Wurzel für den Cluster darüber fixiert (Einstellung upper_root: das SHA256:... seiner CA, wie `ytctl --skv-status` es dort ausgibt) - nichts, was er übergibt, wird übernommen, also kein TLS zu ihm"
