_version: 1
# [i18n] yt-core's messages in German: one file per language (en, ru, and - not reviewed -
# fr, de, zh, ja), every key in each. An error's message starts with its code, the same in
# every language (src/i18n.rs tests it) - after a SQLSTATE such as 0A000: when it has one,
# which the extension reads at position 0. YT lite's codes have three digits, YT-Ennn:
# yt-core-proto YT-E001 to YT-E029, yt-core YT-E030 and up. YT Cluster's own have four,
# YT-Ennnn. ytserv reads these files too, by symlink (its locales/lite.<lang>.yml): what a
# shared link file says is the same there, under the same code.

# === the shared link files (src/core/signin.rs, route.rs): the lite node and ytserv ===
link-no-target-above: "YT-E030 kein Knoten des Clusters darüber, über den man sich anmelden könnte"
link-no-target-az: "YT-E031 kein Knoten der az %{az}, über den man sich anmelden könnte"
# the dial rules' reasons: the tail of the message that refuses a dial - no code of their own
link-rule-lower: "ein LOWER-Cluster wird nie angewählt: er meldet sich bei uns an, und wir halten einen Prüfschlüssel für ihn statt einer Adresse"
link-rule-upper-member: "Regel 1: nur der Leader dieses Clusters wählt nach oben; ein Mitglied hat über eine Clustergrenze hinweg nichts anzuwählen"
link-rule-upper-leader: "Regel 1: eine Verbindung nach oben muss den Leader des oberen Clusters meiden - einen regulären Knoten wählen"
link-rule-neighbor: "Regel 2: eine Nachbarverbindung läuft nur von Leader zu Leader"

# === the lite node (src/core/store.rs, calls.rs) ===
lite-leaf-no-down: "YT-E032 ein Lite-Knoten ist ein Blatt: von ihm geht nichts nach unten"
# a call's failure, the tail of the message that names the turn - no code of their own
lite-call-tls: "%{host} (TLS): %{error}"
lite-call-then-plaintext: "%{first} - danach unverschlüsselt: %{error}"

# === yt-lite: its command line and its start (src/main.rs) ===
lite-usage-about: "yt-lite - YT lite: ein YT-Knoten für eine Datenbank dieser PostgreSQL-Instanz, ein Blatt im\nYT Cluster. Er bedient den Unix-Socket der Erweiterung yt_cluster, behält, was die Datenbank\ncommittet, bis der Cluster darüber es hat, und wendet an, was herunterkommt.\n"
lite-usage-args: "  yt-lite [--db] <url> [--config <schema.table>] [--file <file>] [--uuid <uuid>] [-v | -q]\n\n  <url>               die Datenbank, die er bedient, über den Unix-Socket der Instanz:\n                      postgresql://postgres@localhost/appdb?host=/var/run/postgresql\n  --config            ihre Konfigurationstabelle (Standard: yt_config der Erweiterung)\n  --file              Zeilen key=value: Einstellungen unten, vor der Konfigurationstabelle\n  --uuid              UUID dieses Knotens (Standard: die in der Konfigurationstabelle)\n  -v, -q              Debug oder nur Warnungen; -h dieser Text, -V die Version\n"
lite-usage-settings: "Einstellungen - Zeile `name=value` aus --file oder Zeile der Konfigurationstabelle, Modul L:\n  upper       Knoten des Clusters darüber (http://host:port), kommagetrennt, der Reihe nach\n  upper_root  Wurzel des Clusters darüber, SHA256:... - seine CA, wie `ytctl --skv-status` sie\n              dort ausgibt; nur was zu ihr führt, wird aus diesem Cluster übernommen\n  cluster_db  Name dieser Datenbank im Cluster darüber (Standard: ihr eigener)\n  key_dir     wo dieser Knoten seine CA hält (Standard: ~/.yt-lite/<this node's uuid>)\n  lang        Sprache der Meldungen: en, ru, fr, de, zh oder ja (Standard: die der Datenbank)\n  migrate     sge-Schemas (S<Version>__Name.yaml) und Skripte eines Verzeichnisses, beim Start;\n              danach wird jede genannte Tabelle mit Primärschlüssel synchronisiert (yt_setup)\n\n  INSERT INTO yt_config (name, module, value) VALUES ('upper', 'L', 'http://node1:7421');\n"
lite-usage-link: "Keine az: Ein Lite-Knoten hat keine zu setzen. Der Knoten, bei dem er sich anmeldet,\nnimmt ihn als Knoten seiner eigenen az (yt_info zeigt welcher) und schickt ihm, was sie hält.\n\nDie Verbindung: Der Cluster darüber nimmt diesen Knoten per CA auf, die beim ersten\nStart entsteht. Sein Betreiber bestätigt sie am Leader, nach der Anmeldung - `ytctl\n--skv-approve <uuid> --fingerprint <fp>`, der Fingerprint aus dem Start-Log von yt-lite. Danach\ngegenzeichnet der Cluster sie, und jeder Aufruf an ihn läuft über TLS.\n\nFehler: Jeder beginnt mit seinem Code, YT-Ennn - nach einem SQLSTATE wie 0A000:, falls er einen\nhat; https://docs.dbinvent.com/errors/<code> erklärt ihn.\n"
lite-args: "YT-E033 die Kommandozeile: %{error}"
lite-no-setting: "YT-E034 keine Einstellung %{name}: eine Zeile `%{name}=...` in --file oder eine Zeile der Konfigurationstabelle, Modul L: INSERT INTO yt_config (name, module, value) VALUES ('%{name}', 'L', '...')"
lite-no-key-dir: "YT-E035 kein key_dir gesetzt und kein HOME: wo dieser Knoten seine CA hält - eine Zeile `key_dir=...` in --file oder eine Zeile der Konfigurationstabelle, Modul L"
lite-pid-file: "YT-E036 die PID-Datei %{file}: %{error}"
lite-another-node: "YT-E037 ein anderer Knoten bedient %{socket}: Prozess %{pid} (seine PID-Datei %{file})"
lite-pid-race: "YT-E038 die PID-Datei %{file}: von einem anderen Start zur selben Zeit belegt"
lite-socket: "YT-E039 der Unix-Socket: %{error}"
lite-socket-stopped: "YT-E040 der Unix-Socket-Server ist gestoppt: %{error}"
lite-ca: "YT-E041 die CA dieses Knotens: %{error}"
lite-no-root: "YT-E042 kein upper_root gesetzt: nichts, was der Cluster darüber übergibt, wird übernommen, also kein TLS zu ihm - setzen Sie das SHA256:... seiner CA, wie `ytctl --skv-status` es dort ausgibt"
lite-start: "yt-lite %{version}: ein Blatt des Clusters bei %{hosts}"
lite-ca-line: "die CA dieses Knotens %{fingerprint} (gespeichert in %{dir}): der Cluster darüber bestätigt sie auf seinem Leader - ytctl --skv-approve %{uuid} --fingerprint %{fingerprint}"
lite-tls-line: "Link-TLS: %{status}"
lite-serving: "bedient Datenbank %{db} (als %{cluster_db} darüber) auf %{socket}, Knoten %{uuid}"
lite-stopped: "yt-lite gestoppt: %{why}"
lite-signal-interrupt: "Unterbrechung"
lite-signal-terminate: "Beenden"
lite-signal-hangup: "Terminal getrennt"
lite-signal-none: "kein Signal-Handler"

