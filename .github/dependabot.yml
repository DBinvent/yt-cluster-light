# Dependabot: weekly updates of the crates' dependencies and of the actions the workflows
# run. Security updates are switched on in the repository's settings (Code security), not
# here.
#
# Every crate's dependencies come from crates.io (diff_doc too, 1.1 on): its cargo updates
# resolve. Its earlier failures were diff_doc's path to a sibling checkout.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # one pull request for the minor and patch updates of a week; a major update comes on
    # its own
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # the actions .github/workflows runs (audit.yml: cargo audit and cargo geiger; trivy.yml:
  # trivy, pinned to a commit - Dependabot moves the pin; coverage.yml: cargo llvm-cov)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
