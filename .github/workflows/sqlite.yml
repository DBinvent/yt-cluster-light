name: sqlite

# [sqlite] yt-sqlite, the SQLite loadable extension (yt-sqlite/, sqlpkg.json). On every push and
# pull request: built and tested on Linux - loaded into a SQLite and linked to a node above
# served in the test (yt-core tests/sqlite_ext.rs) - and VERSION, yt-sqlite's version and
# sqlpkg.json's checked to agree. On a tag v<version>: built for the five platforms sqlpkg
# installs on, each a zip of yt.so / yt.dylib / yt.dll, attached to that tag's release - the
# assets sqlpkg.json names (`sqlpkg install github.com/DBinvent/yt-cluster-light`).
#
# Linux builds in a manylinux_2_28 container: glibc 2.28 and later, RHEL 8 on. OpenSSL is built
# into the extension (openssl's `vendored`): perl for it everywhere, NASM on Windows.
#
# diff_doc comes from crates.io (1.1 on, its `proto` feature): each job checks out this
# repository alone, under yt-cluster-light/.
on:
  push:
    branches-ignore: ["dependabot/**"]   # their pull request runs it
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: yt-cluster-light
    steps:
      - uses: actions/checkout@v7
        with:
          path: yt-cluster-light
      - uses: dtolnay/rust-toolchain@stable
      # protoc for yt-core-proto's build.rs, the OpenSSL headers for yt-core's tests
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev
      - name: one version - VERSION, yt-sqlite's, sqlpkg.json's
        run: |
          v="$(tr -d ' \n' < VERSION)"
          grep -q "^version = \"$v\"" yt-sqlite/Cargo.toml || { echo "yt-sqlite/Cargo.toml is not $v"; exit 1; }
          python3 -c 'import json, sys; v = json.load(open("sqlpkg.json"))["version"]; sys.exit(0 if v == sys.argv[1] else f"sqlpkg.json is {v}, not {sys.argv[1]}")' "$v"
      - run: cargo build --manifest-path yt-sqlite/Cargo.toml
      - name: the extension loaded into a SQLite and linked (yt-core tests/sqlite_ext.rs)
        run: YT_SQLITE_EXT="$PWD/yt-sqlite/target/debug/libyt.so" cargo test -p yt-core --test sqlite_ext

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write   # the release's assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, container: "quay.io/pypa/manylinux_2_28_x86_64", platform: linux-x64, lib: libyt.so, name: yt.so }
          - { os: ubuntu-24.04-arm, container: "quay.io/pypa/manylinux_2_28_aarch64", platform: linux-arm64, lib: libyt.so, name: yt.so }
          - { os: macos-13, container: "", platform: macos-x64, lib: libyt.dylib, name: yt.dylib }
          - { os: macos-14, container: "", platform: macos-arm64, lib: libyt.dylib, name: yt.dylib }
          - { os: windows-latest, container: "", platform: win-x64, lib: yt.dll, name: yt.dll }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
        working-directory: yt-cluster-light
    steps:
      - name: perl for OpenSSL's build (manylinux)
        if: matrix.container != ''
        working-directory: /
        run: dnf install -y perl-core perl-IPC-Cmd openssl-devel
      - uses: actions/checkout@v7
        with:
          path: yt-cluster-light
      - uses: dtolnay/rust-toolchain@stable
      # protoc for yt-core-proto's build.rs - Windows builds from the generated files it keeps
      - uses: arduino/setup-protoc@v3
        if: runner.os != 'Windows'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
      - name: the tag is this version
        run: |
          v="$(tr -d ' \r\n' < VERSION)"
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "tag $GITHUB_REF_NAME, VERSION $v"; exit 1; }
          echo "V=$v" >> "$GITHUB_ENV"
      - run: cargo build --release --manifest-path yt-sqlite/Cargo.toml
      - name: the built extension loaded and linked (Linux)
        if: runner.os == 'Linux'
        run: YT_SQLITE_EXT="$PWD/yt-sqlite/target/release/libyt.so" cargo test -p yt-core --test sqlite_ext
      - name: the asset, yt-sqlite-<version>-<platform>.zip
        run: |
          mkdir -p out
          cp "yt-sqlite/target/release/${{ matrix.lib }}" "out/${{ matrix.name }}"
          py="$(command -v python3 || command -v python || ls /opt/python/cp312-cp312/bin/python3)"
          (cd out && "$py" -m zipfile -c "../yt-sqlite-$V-${{ matrix.platform }}.zip" "${{ matrix.name }}")
      - uses: softprops/action-gh-release@v3
        with:
          files: yt-cluster-light/yt-sqlite-*.zip
