name: coverage

# [coverage] The whole `cargo test` of the workspace - yt-core-proto, yt-core and yt-lite,
# the link tests against a cluster node served in the same process - and its line coverage,
# the generated gRPC code (protogen) left out. The tests that need a PostgreSQL with the
# extension (yt-core tests/pg_live.rs, pg_service.rs, yt_lite_bin.rs) run here: the extension
# is built with `make`, and each test starts a throwaway PostgreSQL with it (tests/fixture,
# YT_LITE_EXT_SO). The badge is our own, no third party: drawn
# from lcov.info and kept on the `badges` branch, which the README shows. The target is 80% of
# the lines (owner, 2026-11-13): the last step fails the run under it, the badge written first.
#
# diff_doc comes from crates.io (1.1 on, its `proto` feature): the run checks out this
# repository alone, under yt-cluster-lite/.
on:
  push:
    branches-ignore: ["dependabot/**"]   # their pull request runs it
  pull_request:
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-24.04
    env:
      PG: "16"   # the PostgreSQL major the extension is built for and the tests run
    permissions:
      contents: write   # the coverage badge's push, to the badges branch
    defaults:
      run:
        # bash -eo pipefail: GitHub's default shell has no pipefail, and a piped step
        # (cargo geiger | tee) would hide the command's failure
        shell: bash
        working-directory: yt-cluster-lite
    steps:
      - uses: actions/checkout@v7
        with:
          path: yt-cluster-lite
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # protoc for the protos, the OpenSSL headers for yt-lite's TLS; PostgreSQL and its server
      # headers, and what the extension builds with, for the tests on a throwaway PostgreSQL.
      # PostgreSQL 16 by name, its server and its headers from the one repository the runner
      # takes them from: the image carries PGDG's postgresql-common, which Ubuntu's
      # postgresql-server-dev-all refuses (2026-11-14). On Ubuntu 24.04: 26.04's apt could not
      # install PostgreSQL 18's server headers beside protobuf, and ubuntu-latest is 26.04 now
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev
          postgresql-$PG postgresql-server-dev-$PG protobuf-c-compiler libprotobuf-c-dev libcurl4-openssl-dev
      - name: the extension, for the tests that run PostgreSQL
        run: |
          # with_llvm=no: PGDG's PostgreSQL is built with LLVM, and PGXS would emit JIT bitcode
          # with clang, which the runner has not (make: Error 127) - as Dockerfile.el9 builds
          make -C ytpgc PG_CONFIG="/usr/lib/postgresql/$PG/bin/pg_config" with_llvm=no
          echo "YT_LITE_EXT_SO=$(ls "$PWD"/ytpgc/yt_cluster*-pg"$PG"-*.so)" >> "$GITHUB_ENV"
          echo "PG_BIN=/usr/lib/postgresql/$PG/bin" >> "$GITHUB_ENV"
      - run: cargo llvm-cov --workspace --no-fail-fast --ignore-filename-regex protogen --lcov --output-path lcov.info
      # [coverage] our own badge, no third party: lcov.info's line coverage, drawn by
      # .github/coverage-badge.py and kept on the `badges` branch - one commit, replaced
      # each time - which the README shows. On a push to the default branch only: a pull
      # request measures, no more
      - name: coverage badge
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pct=$(python3 .github/coverage-badge.py lcov.info /tmp/badges/coverage.svg)
          cd /tmp/badges
          git init -q -b badges
          git add coverage.svg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "coverage ${pct}%"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
      # the check, on every run - a pull request's too: at least 80% of the lines
      - name: coverage check, 80% of the lines
        run: python3 .github/coverage-badge.py lcov.info /tmp/coverage-check.svg --min 80
