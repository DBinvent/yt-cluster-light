[package]
name = "yt-turso-load"
version = "1.21.0"
edition.workspace = true
license.workspace = true
description = "YT Cluster lite: a load like pgbench on Turso, with the light node inside - a leaf of a YT Cluster in an application"
publish = false

[dependencies]
yt-core = { path = "../yt-core", default-features = false, features = ["turso"] }
yt-core-proto = { path = "../yt-core-proto", default-features = false }
turso = "=0.9.0-pre.5"
tokio = { version = "^1.52", features = ["macros", "rt-multi-thread", "time", "sync", "fs"] }
md5 = "^0.8"
